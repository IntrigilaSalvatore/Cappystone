<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Access</title>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    font-family: Arial;
    background: url("https://www.spcf.edu.ph/uploads/Sliders/2f6efc6ff35273df8149d3a4e1563b4b.jpg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    color:white;
    overflow:hidden;
}

/* LIGHT MODE */
body.light-mode{
    color:#111827;
}

/* FOG CONTAINER */
.fog{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

/* FOG LAYERS */
.fog-layer{
    position:absolute;
    width:200%;
    height:200%;
    top:-50%;
    left:-50%;
    filter:blur(60px);
}

/* ANIMATION */
.layer1{
    animation:fogMove1 80s linear infinite;
}

.layer2{
    animation:fogMove2 120s linear infinite;
    opacity:0.7;
}

.layer3{
    animation:fogMove3 160s linear infinite;
    opacity:0.5;
}

@keyframes fogMove1{
    0%{
        transform:translateX(0) translateY(0);
    }

    100%{
        transform:translateX(-400px) translateY(-150px);
    }
}

@keyframes fogMove2{
    0%{
        transform:translateX(0) translateY(0);
    }

    100%{
        transform:translateX(-300px) translateY(200px);
    }
}

@keyframes fogMove3{
    0%{
        transform:translateX(0) translateY(0);
    }

    100%{
        transform:translateX(-500px) translateY(100px);
    }
}

/* DARK MODE FOG */
body:not(.light-mode) .fog-layer{
    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(0,0,0,0.5) 0%,
            transparent 40%
        ),
        radial-gradient(
            circle at 70% 60%,
            rgba(0,0,0,0.4) 0%,
            transparent 45%
        ),
        radial-gradient(
            circle at 50% 80%,
            rgba(0,0,0,0.35) 0%,
            transparent 40%
        );
}

/* LIGHT MODE FOG */
body.light-mode .fog-layer{
    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(255,255,255,0.15) 0%,
            transparent 40%
        ),
        radial-gradient(
            circle at 70% 60%,
            rgba(255,255,255,0.12) 0%,
            transparent 45%
        ),
        radial-gradient(
            circle at 50% 80%,
            rgba(255,255,255,0.1) 0%,
            transparent 40%
        );
}

/* LOGIN BOX */
.box{
    background:rgba(30,41,59,0.9);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:12px;
    width:320px;
    text-align:center;
    position:relative;
    z-index:2;
}

body.light-mode .box{
    background:rgba(255,255,255,0.9);
    color:#111827;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

/* LOGIN BUTTON */
button.submit-btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#FADA7A;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button.submit-btn:hover{
    background:#d9a944;
}

button.submit-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

/* ERROR */
.error{
    color:#ef4444;
    margin-top:10px;
}

/* TOGGLE BUTTON */
.toggle-btn{
    position:fixed;
    top:20px;
    right:20px;
    width:50px;
    height:50px;
    border-radius:50%;
    border:none;
    background:#888;
    color:white;
    cursor:pointer;
    font-size:10px;
    z-index:3;
}

body.light-mode .toggle-btn{
    background:#111827;
    color:#f0f0f0;
}

</style>

</head>

<body>

<div class="fog">
    <div class="fog-layer layer1"></div>
    <div class="fog-layer layer2"></div>
    <div class="fog-layer layer3"></div>
</div>

<button
 id="modeToggle"
 class="toggle-btn"
 onclick="toggleMode()">
Light Mode </button>

<div class="box">

```
<h2>Admin Access</h2>

<form onsubmit="checkLogin(event)">

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
        required
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
        autocomplete="current-password"
    >

    <button
        type="submit"
        class="submit-btn"
        id="loginButton">
        Enter Dashboard
    </button>

</form>

<div id="error" class="error"></div>
```

</div>

<script>

/* ============================================================
   SUPABASE CONFIGURATION
   ============================================================ */

const SUPABASE_URL =
    "https://raphpzlmjjzgwohjgczu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_-SIrgE8sT5liBPH0jOSTdA_CREkwiPd";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ============================================================
   EXISTING LOGIN SESSION CHECK
   ============================================================ */

if (
    localStorage.getItem("access_granted") === "true"
) {
    window.location.href = "index.html";
}


/* ============================================================
   SUPABASE USERNAME + PASSWORD LOGIN
   ============================================================ */

async function checkLogin(event) {

    event.preventDefault();

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const errorElement =
        document.getElementById("error");

    const loginButton =
        document.getElementById("loginButton");

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    errorElement.textContent = "";

    if (!username || !password) {

        errorElement.textContent =
            "Please enter your username and password.";

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Checking...";

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "verify_admin_login",
                {
                    p_username: username,
                    p_password: password
                }
            );

        if (error) {

            console.error(
                "SUPABASE LOGIN ERROR:",
                error
            );

            errorElement.textContent =
                "Unable to connect to the authentication service.";

            return;
        }

        /*
         * The PostgreSQL function returns:
         *
         * {
         *   valid: true,
         *   user_id: ...,
         *   username: ...,
         *   display_name: ...
         * }
         *
         * OR
         *
         * {
         *   valid: false
         * }
         */

        if (
            data &&
            data.valid === true
        ) {

            /*
             * Keep the existing dashboard
             * authentication flag.
             */
            localStorage.setItem(
                "access_granted",
                "true"
            );

            /*
             * Store basic user information
             * for dashboard display/use.
             */
            localStorage.setItem(
                "admin_user_id",
                String(data.user_id)
            );

            localStorage.setItem(
                "admin_username",
                data.username
            );

            localStorage.setItem(
                "admin_display_name",
                data.display_name || data.username
            );

            window.location.href =
                "index.html";

        } else {

            errorElement.textContent =
                "Invalid username or password.";

            passwordInput.value = "";
            passwordInput.focus();
        }

    } catch (err) {

        console.error(
            "LOGIN ERROR:",
            err
        );

        errorElement.textContent =
            "An unexpected error occurred.";

    } finally {

        loginButton.disabled = false;
        loginButton.textContent =
            "Enter Dashboard";
    }
}


/* ============================================================
   THEME TOGGLE
   ============================================================ */

const toggleBtn =
    document.getElementById("modeToggle");


/* Load saved theme preference */

if (
    localStorage.getItem("theme") === "light"
) {

    document.body.classList.add(
        "light-mode"
    );

    toggleBtn.textContent =
        "Dark Mode";
}


/* Toggle light/dark mode */

function toggleMode() {

    document.body.classList.toggle(
        "light-mode"
    );

    if (
        document.body.classList.contains(
            "light-mode"
        )
    ) {

        toggleBtn.textContent =
            "Dark Mode";

        localStorage.setItem(
            "theme",
            "light"
        );

    } else {

        toggleBtn.textContent =
            "Light Mode";

        localStorage.setItem(
            "theme",
            "dark"
        );
    }
}

</script>

</body>
</html>
