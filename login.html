<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom Performance Access</title>

<!-- Supabase JS Client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: url("https://www.spcf.edu.ph/uploads/Sliders/2f6efc6ff35273df8149d3a4e1563b4b.jpg") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: white;
    overflow: hidden;
}

body.light-mode {
    color: #111827;
}

.box {
    background: rgba(30,41,59,0.92);
    backdrop-filter: blur(10px);
    padding: 30px 35px;
    border-radius: 12px;
    width: 340px;
    text-align: center;
    position: relative;
    z-index: 2;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

body.light-mode .box {
    background: rgba(255,255,255,0.95);
    color: #111827;
}

/* ROLE SELECTION TABS */
.role-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: rgba(15, 23, 42, 0.5);
    padding: 4px;
    border-radius: 8px;
}

.role-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.role-tab.active {
    background: #005A92;
    color: #ffffff;
}

body.light-mode .role-tab.active {
    background: #1e40af;
    color: #ffffff;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    box-sizing: border-box;
}

button.submit-btn {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    background: #FADA7A;
    color: #1e293b;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button.submit-btn:hover {
    background: #d9a944;
}

button.submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.error {
    color: #ef4444;
    margin-top: 12px;
    min-height: 20px;
    font-size: 13px;
}

.toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    background: #888;
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    z-index: 3;
}

body.light-mode .toggle-btn {
    background: #111827;
    color: #f0f0f0;
}
</style>
</head>

<body>

<button id="modeToggle" class="toggle-btn" onclick="toggleMode()">Light Mode</button>

<div class="box">
    <h2 id="loginTitle" style="margin-top:0; margin-bottom:15px; color:#ffffff;">Admin Access</h2>

    <!-- ROLE SWITCH TABS -->
    <div class="role-tabs">
        <button type="button" class="role-tab active" id="tabAdmin" onclick="switchRole('ADMIN')">Admin Access</button>
        <button type="button" class="role-tab" id="tabFaculty" onclick="switchRole('FACULTY')">Faculty Access</button>
    </div>

    <form onsubmit="checkCode(event)">
        <input type="text" id="username" placeholder="Enter Username" required autocomplete="username">
        <input type="password" id="code" placeholder="Enter Access Code" required autocomplete="current-password">

        <button type="submit" class="submit-btn" id="loginButton">Enter Dashboard</button>
    </form>

    <div id="error" class="error"></div>
</div>

<script>
const SUPABASE_URL = "https://raphpzlmjjzgwohjgczu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-SIrgE8sT5liBPH0jOSTdA_CREkwiPd";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let selectedRole = "ADMIN";

// AUTO REDIRECT IF LOGGED IN
if (localStorage.getItem("access_granted") === "true") {
    window.location.href = "index.html";
}

function switchRole(role) {
    selectedRole = role;
    const adminTab = document.getElementById("tabAdmin");
    const facultyTab = document.getElementById("tabFaculty");
    const title = document.getElementById("loginTitle");

    if (role === "ADMIN") {
        adminTab.classList.add("active");
        facultyTab.classList.remove("active");
        title.textContent = "Admin Access";
    } else {
        facultyTab.classList.add("active");
        adminTab.classList.remove("active");
        title.textContent = "Faculty Access";
    }
}

async function checkCode(event) {
    event.preventDefault();

    const usernameInput = document.getElementById("username");
    const codeInput = document.getElementById("code");
    const errorDiv = document.getElementById("error");
    const loginButton = document.getElementById("loginButton");

    const username = usernameInput.value.trim();
    const code = codeInput.value;

    errorDiv.innerText = "";

    if (!username || !code) {
        errorDiv.style.color = "#ef4444";
        errorDiv.innerText = "Please enter your username and access code.";
        return;
    }

    loginButton.disabled = true;
    loginButton.innerText = "Verifying...";
    errorDiv.style.color = "#FADA7A";
    errorDiv.innerText = "Verifying credentials...";

    try {
        const { data, error } = await supabaseClient.rpc("verify_admin_login", {
            p_username: username,
            p_password: code
        });

        if (error) {
            errorDiv.style.color = "#ef4444";
            errorDiv.innerText = "Supabase Error: " + error.message;
            return;
        }

        if (data === true) {
            errorDiv.style.color = "#22c55e";
            errorDiv.innerText = "Access Granted!";

            // 1. Create audit log entry in Supabase
            const { data: logData } = await supabaseClient
                .from("access_logs")
                .insert({
                    username: username,
                    user_role: selectedRole,
                    login_time: new Date().toISOString()
                })
                .select("id")
                .single();

            // 2. Save Session Data
            localStorage.setItem("access_granted", "true");
            localStorage.setItem("user_role", selectedRole);
            localStorage.setItem("current_user", username);
            if (logData && logData.id) {
                localStorage.setItem("current_log_id", logData.id);
            }

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);

        } else {
            errorDiv.style.color = "#ef4444";
            errorDiv.innerText = "Invalid Username or Access Code";
            codeInput.value = "";
            codeInput.focus();
        }

    } catch (err) {
        errorDiv.style.color = "#ef4444";
        errorDiv.innerText = "Connection Error: " + (err.message || "Unknown error");
    } finally {
        loginButton.disabled = false;
        loginButton.innerText = "Enter Dashboard";
    }
}

function toggleMode() {
    document.body.classList.toggle("light-mode");
    const toggleBtn = document.getElementById("modeToggle");
    if (document.body.classList.contains("light-mode")) {
        toggleBtn.textContent = "Dark Mode";
        localStorage.setItem("theme", "light");
    } else {
        toggleBtn.textContent = "Light Mode";
        localStorage.setItem("theme", "dark");
    }
}

if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light-mode");
    document.getElementById("modeToggle").textContent = "Dark Mode";
}
</script>
</body>
</html>
