<script>


// ============================================================
// SUPABASE CONFIGURATION
// ============================================================

const SUPABASE_URL =
    "https://raphpzlmjjzgwohjgczu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_-SIrgE8sT5liBPH0jOSTdA_CREkwiPd";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ============================================================
// EXISTING LOGIN SESSION CHECK
// CHECK EXISTING LOGIN
// ============================================================

if (
    localStorage.getItem("access_granted") === "true"
) {

    window.location.href = "index.html";

}



// ============================================================
// VERIFY USERNAME + ACCESS CODE
// LOGIN FUNCTION
// ============================================================

async function checkCode(event) {

    event.preventDefault();


    // --------------------------------------------------------
    // GET ELEMENTS
    // --------------------------------------------------------

    const usernameInput =
        document.getElementById("username");

    const codeInput =
        document.getElementById("code");

    const errorDiv =
        document.getElementById("error");

    const loginButton =
        document.getElementById("loginButton");


    // --------------------------------------------------------
    // GET VALUES
    // --------------------------------------------------------

    const username =
        usernameInput.value.trim();

    const code =
        codeInput.value;


    // --------------------------------------------------------
    // CLEAR MESSAGE
    // --------------------------------------------------------

    errorDiv.innerText = "";


    // --------------------------------------------------------
    // VALIDATE INPUT
    // --------------------------------------------------------

    if (!username || !code) {

        errorDiv.style.color = "#ef4444";

        errorDiv.innerText =
            "Please enter your username and access code.";

        return;
    }


    // --------------------------------------------------------
    // DISABLE BUTTON
    // --------------------------------------------------------

    loginButton.disabled = true;

    loginButton.innerText = "Verifying...";
    loginButton.innerText =
        "Verifying...";


    errorDiv.style.color =
        "#FADA7A";

    errorDiv.innerText =
        "Verifying credentials...";


    try {


        // ----------------------------------------------------
        // CALL SUPABASE FUNCTION
        // ----------------------------------------------------

        const { data, error } =
            await supabaseClient.rpc(
                "verify_admin_login",
                {
                    p_username: username,
                    p_password: code
                }
            );


        // ----------------------------------------------------
        // CONSOLE DEBUG INFORMATION
        // ----------------------------------------------------

        console.log(
            "LOGIN RESULT:",
            data
        );

        console.log(
            "LOGIN ERROR:",
            error
        );


        // ----------------------------------------------------
        // SUPABASE ERROR
        // ----------------------------------------------------

        if (error) {

            console.error(
                "Supabase Login Error:",
                "SUPABASE LOGIN ERROR:",
                error
            );

            errorDiv.style.color = "#ef4444";

            errorDiv.style.color =
                "#ef4444";


            errorDiv.innerText =
                "Error checking credentials.";
                "Supabase Error: " +
                error.message;


            return;
        }


        if (
            data &&
            data.valid === true
        ) {
        // ----------------------------------------------------
        // VALID LOGIN
        // ----------------------------------------------------

        if (data === true) {


            errorDiv.style.color =
                "#22c55e";

            errorDiv.style.color = "#22c55e";

            errorDiv.innerText =
                "Access Granted!";


            // Existing dashboard access flag
            // ------------------------------------------------
            // STORE LOGIN SESSION
            // ------------------------------------------------

            localStorage.setItem(
                "access_granted",
                "true"
            );


            // Save currently logged-in user
            // ------------------------------------------------
            // STORE CURRENT ADMIN USER
            // ------------------------------------------------

            localStorage.setItem(
                "current_admin_user",
                data.username
                username
            );


            // Save display name
            localStorage.setItem(
                "current_admin_name",
                data.display_name || data.username
            );

            // ------------------------------------------------
            // REDIRECT TO DASHBOARD
            // ------------------------------------------------

            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 800);


        } else {


            errorDiv.style.color = "#ef4444";
            // ------------------------------------------------
            // INVALID LOGIN
            // ------------------------------------------------

            errorDiv.style.color =
                "#ef4444";


            errorDiv.innerText =
                "Invalid Username or Access Code";


            codeInput.value = "";

            codeInput.focus();

        }


    } catch (err) {


        // ----------------------------------------------------
        // UNEXPECTED ERROR
        // ----------------------------------------------------

        console.error(
            "Unexpected Login Error:",
            "UNEXPECTED LOGIN ERROR:",
            err
        );

        errorDiv.style.color = "#ef4444";

        errorDiv.style.color =
            "#ef4444";


        errorDiv.innerText =
            "Connection error.";
            "Connection Error: " +
            (
                err.message ||
                "Unknown error"
            );

    }

    } finally {

    loginButton.disabled = false;

    loginButton.innerText =
        "Enter Dashboard";
}
        // ----------------------------------------------------
        // RESTORE BUTTON
        // ----------------------------------------------------

        loginButton.disabled = false;

        loginButton.innerText =
            "Enter Dashboard";
    }

}


// ============================================================
// THEME TOGGLE
// ============================================================

const toggleBtn =
    document.getElementById("modeToggle");



// Load saved theme preference on launch
// ============================================================
// LOAD SAVED THEME
// ============================================================

if (
    localStorage.getItem("theme") === "light"
) {

    document.body.classList.add("light-mode");
    document.body.classList.add(
        "light-mode"
    );

    toggleBtn.textContent =
        "Dark Mode";

}


// ============================================================
// TOGGLE LIGHT / DARK MODE
// ============================================================

function toggleMode() {

    document.body.classList.toggle("light-mode");
    document.body.classList.toggle(
        "light-mode"
    );


    if (
        document.body.classList.contains("light-mode")
        document.body.classList.contains(
            "light-mode"
        )
    ) {

        toggleBtn.textContent =
            "Dark Mode";


        localStorage.setItem(
            "theme",
            "light"
        );


    } else {


        toggleBtn.textContent =
            "Light Mode";


        localStorage.setItem(
            "theme",
            "dark"
        );

    }

}



</script>
